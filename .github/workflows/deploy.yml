name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      # 1. Жестко задаем нужную версию Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0' # Указываем точную поддерживаемую версию
          cache: 'npm'

      # 2. Устанавливаем зависимости вашего проекта
      - name: Install dependencies
        run: npm ci

      # 3. Собираем проект (команда сгенерирует папку dist)
      - name: Build Astro site
        run: npm run build

      # 4. Архивация собранных файлов для деплоя
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist # Astro по умолчанию собирает сайт в эту папку


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 5. Публикация на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
